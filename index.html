<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Graduation Invitation</title>

  <!-- FONT VIẾT TAY ĐẸP -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600&family=Playfair+Display:wght@500;600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TRANG TRÍ NỀN -->
   
  <img class="decor balloon left" src="./balloon-blue.png" alt="Blue Balloon">
  <img class="decor balloon right" src="./balloon-gold.png" alt="Gold Balloon">



  <img class="decor confetti" src="./confetti.png" alt="Confetti">

  <!-- CARD -->
  <div class="card">
    <div class="cap">🎓</div>

    <div class="subtitle">YOU’RE INVITED TO</div>

    <h1 class="gold">Graduation</h1>
    <h1 class="gold">Photoshoot</h1>

    <div class="divider"></div>

    <div class="name">Đặng Như Ngọc</div>

    <div class="info">
      <div>
        <small>DATE</small>
        <strong>18.01</strong>
      </div>
      <div>
        <small>TIME</small>
        <strong>10:00</strong>
      </div>
      <div>
        <small>YEAR</small>
        <strong>2026</strong>
      </div>
    </div>

    <div class="place">
      📍 Trường THCS Xuân Hòa
    </div>
  </div>

</body>
</html>
